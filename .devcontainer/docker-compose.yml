# Stack de développement DocuGen : PostgreSQL + Django + Angular.
# Utilisé par le dev container (.devcontainer/devcontainer.json) et lançable
# directement avec :  docker compose -f .devcontainer/docker-compose.yml up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docugen
      POSTGRES_USER: docugen
      POSTGRES_PASSWORD: docugen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docugen -d docugen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: docugen
      DB_USER: docugen
      DB_PASSWORD: docugen
      DB_HOST: db
      DB_PORT: "5432"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://127.0.0.1:4200"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - ../frontend:/app
      # Préserve les node_modules installés dans l'image (le hôte n'en a pas).
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  pgdata:
