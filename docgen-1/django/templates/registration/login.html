{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content_public %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Atelier documentaire</h1>
    <p>Connectez-vous pour gérer projets et documents.</p>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}<div class="flash flash-error">Identifiants incorrects.</div>{% endif %}
      <div class="field">
        <label for="id_username">Nom d'utilisateur</label>
        {{ form.username }}
      </div>
      <div class="field">
        <label for="id_password">Mot de passe</label>
        {{ form.password }}
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
