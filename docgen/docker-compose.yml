services:
  db:
    image: postgres:16-alpine
    container_name: docgen_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docgen}
      POSTGRES_USER: ${POSTGRES_USER:-docgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docgen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docgen} -d ${POSTGRES_DB:-docgen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./django
    container_name: docgen_web
    restart: unless-stopped
    command: ["./entrypoint.sh"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD:-docgen}@db:5432/${POSTGRES_DB:-docgen}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      API_KEY: ${API_KEY:-dev-api-key}
    volumes:
      - ./django:/app
      - media:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  bruno:
    build:
      context: ./bruno
    container_name: docgen_bruno
    # Bruno CLI runs the collection against the Django API, then idles so you
    # can `docker compose exec bruno bru run ...` on demand.
    environment:
      API_BASE_URL: http://web:8000
      API_KEY: ${API_KEY:-dev-api-key}
    volumes:
      # The "specific folder" holding the external-usage API collection.
      # Edit files under ./bruno/collection on the host; they are live here.
      - ./bruno/collection:/collection
    working_dir: /collection
    depends_on:
      - web
    # Keep the container alive for interactive runs; see bruno/Dockerfile CMD.

volumes:
  pgdata:
  media:
