{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}DocGen{% endblock %} · {{ company.name|default:"DocGen" }}</title>

  <!-- Vuetify 3 + Vue 3 + Material Design Icons (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.6/dist/vuetify.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    [v-cloak] { display: none; }
    html { overflow-y: auto; }
    .mono { font-family: monospace; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.6/dist/vuetify.min.js"></script>
  <script>
    // Jeton CSRF + helpers d'appel API partagés par toutes les pages.
    window.CSRF = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    window.api = async function (url, opts) {
      opts = opts || {};
      const headers = Object.assign(
        { 'Content-Type': 'application/json', 'X-CSRFToken': window.CSRF },
        opts.headers || {}
      );
      const res = await fetch(url, Object.assign({}, opts, { headers }));
      const text = await res.text();
      let json = {};
      try { json = text ? JSON.parse(text) : {}; } catch (e) { json = { _raw: text }; }
      json._status = res.status;
      json._ok = res.ok;
      return json;
    };

    window.apiUpload = async function (url, formData) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'X-CSRFToken': window.CSRF },
        body: formData,
      });
      return res.json();
    };

    // Éléments de navigation communs.
    window.NAV_ITEMS = [
      { title: 'Tableau de bord', icon: 'mdi-view-dashboard', href: '/' },
      { title: 'Projets', icon: 'mdi-folder-multiple', href: '/projects/' },
      { title: 'Documents', icon: 'mdi-file-document-multiple', href: '/documents/' },
      { title: 'Formulaires', icon: 'mdi-form-select', href: '/forms/' },
      { title: 'Entreprise', icon: 'mdi-domain', href: '/company/' },
      { title: 'Administration', icon: 'mdi-cog', href: '/admin/' },
    ];

    window.commonData = function () {
      return {
        drawer: true,
        navItems: window.NAV_ITEMS,
        currentPath: window.location.pathname,
        companyName: "{{ company.name|default:'DocGen'|escapejs }}",
        snackbar: { show: false, text: '', color: 'success' },
      };
    };

    window.commonMethods = {
      notify(text, color) {
        this.snackbar = { show: true, text: text, color: color || 'success' };
      },
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
