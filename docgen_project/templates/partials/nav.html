<v-navigation-drawer v-model="drawer" color="grey-lighten-4">
  <v-list-item class="py-4" prepend-icon="mdi-file-document-edit" :title="companyName" subtitle="DocGen Studio"></v-list-item>
  <v-divider></v-divider>
  <v-list nav density="comfortable">
    <v-list-item
      v-for="item in navItems" :key="item.href"
      :href="item.href" :prepend-icon="item.icon" :title="item.title"
      :active="currentPath === item.href || (item.href !== '/' && currentPath.startsWith(item.href))"
      color="primary">
    </v-list-item>
  </v-list>
</v-navigation-drawer>

<v-app-bar color="primary" density="comfortable" elevation="1">
  <v-app-bar-nav-icon @click="drawer = !drawer"></v-app-bar-nav-icon>
  <v-app-bar-title>{% block appbar_title %}DocGen{% endblock %}</v-app-bar-title>
  <template v-slot:append>
    <v-btn icon="mdi-plus" href="/documents/" title="Nouveau document"></v-btn>
  </template>
</v-app-bar>
