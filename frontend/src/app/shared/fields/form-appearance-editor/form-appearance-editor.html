    <div class="card stack">
      <h3>🎨 Apparence du formulaire</h3>
      <mat-checkbox [ngModel]="showProgress" (ngModelChange)="showProgressChange.emit($event)">
        Afficher la progression au répondant
      </mat-checkbox>
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Disposition</mat-label>
          <mat-select [ngModel]="theme.layout || 'card'" (ngModelChange)="set('layout', $event)">
            <mat-option value="card">Carte centrée</mat-option>
            <mat-option value="cover">Bannière de couverture</mat-option>
            <mat-option value="plain">Épuré</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Libellé du bouton d'envoi</mat-label>
          <input matInput [ngModel]="theme.button_label || ''" (ngModelChange)="set('button_label', $event)" placeholder="Envoyer" />
        </mat-form-field>
        <div class="field">
          <label for="fae-accent">Couleur d'accent</label>
          <input id="fae-accent" type="color" [ngModel]="theme.accent || '#ec6608'" (ngModelChange)="set('accent', $event)" />
        </div>
        <div class="field">
          <label for="fae-bg">Couleur de fond</label>
          <input id="fae-bg" type="color" [ngModel]="theme.background || '#f4f5f7'" (ngModelChange)="set('background', $event)" />
        </div>
      </div>
      <div class="field">
        <label for="fae-cover">Image de couverture (bannière)</label>
        <div class="upload-row">
          @if (theme.cover_image) { <img class="thumb" [src]="theme.cover_image" alt="cover" /> }
          <input id="fae-cover" type="file" accept="image/*" (change)="uploadCover($event)" />
          @if (theme.cover_image) { <button class="btn btn-sm btn-ghost" (click)="set('cover_image', '')">Retirer</button> }
        </div>
      </div>
      <p class="muted" style="font-size:.8rem">Le logo de l'entreprise s'affiche automatiquement en tête du formulaire public.</p>
    </div>
